<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny Coffee</title>

    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --peach: #FCCAB0;
            --coral: #F4845F;
            --coral-deep: #E8614D;
            --blush: #FDE8E0;
            --golden: #F5C16C;
            --golden-warm: #EDAA3B;
            --honey: #C8913B;
            --cream: #FFF8F2;
            --sand: #F0E6DA;
            --warm-gray: #8E8078;
            --warm-dark: #3D2E26;
            --warm-darker: #2A1F1A;
            --panel-bg: rgba(255, 248, 242, 0.92);
            --panel-bg-solid: #FFF8F2;
            --shadow-soft: 0 4px 24px rgba(61, 46, 38, 0.10);
            --shadow-medium: 0 8px 32px rgba(61, 46, 38, 0.14);
            --shadow-lifted: 0 12px 40px rgba(61, 46, 38, 0.18);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 26px;
            --radius-xl: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--cream);
            color: var(--warm-dark);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        /* ======================== */
        /* BOTTOM SHEET / CONTROLS  */
        /* ======================== */
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--panel-bg);
            backdrop-filter: blur(40px) saturate(1.6);
            -webkit-backdrop-filter: blur(40px) saturate(1.6);
            padding: 0 20px 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            z-index: 100;
            max-height: 45vh;
            overflow-y: auto;
            box-shadow: 0 -4px 40px rgba(61, 46, 38, 0.10);
            border-top: 1px solid rgba(245, 193, 108, 0.25);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        #controls::-webkit-scrollbar { width: 0; }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Drag handle */
        #controls::before {
            content: '';
            display: block;
            width: 36px;
            height: 4px;
            background: var(--peach);
            border-radius: 4px;
            margin: 12px auto 16px;
            opacity: 0.7;
        }

        @media (min-width: 600px) {
            #controls {
                top: 20px;
                left: 20px;
                right: auto;
                bottom: auto;
                max-width: 320px;
                max-height: calc(100vh - 40px);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-medium);
                border-top: none;
                border: 1px solid rgba(245, 193, 108, 0.2);
                animation: fadeSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            #controls::before { display: none; }
        }

        @keyframes fadeSlideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ======================== */
        /* HEADER / BRAND           */
        /* ======================== */
        .app-header {
            text-align: center;
            margin-bottom: 14px;
        }

        .app-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--coral) 0%, var(--golden-warm) 60%, var(--honey) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-tagline {
            font-size: 11.5px;
            font-weight: 400;
            color: var(--warm-gray);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* ======================== */
        /* SUN INFO PILL            */
        /* ======================== */
        #sun-info {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--warm-dark);
            text-align: center;
            margin-bottom: 12px;
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(245, 193, 108, 0.15), rgba(252, 202, 176, 0.15));
            border-radius: 100px;
            border: 1px solid rgba(245, 193, 108, 0.2);
            letter-spacing: 0.01em;
        }

        /* ======================== */
        /* MAIN BUTTON              */
        /* ======================== */
        .btn-primary {
            background: linear-gradient(135deg, var(--coral) 0%, var(--coral-deep) 100%);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 500;
            width: 100%;
            letter-spacing: 0.02em;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 16px rgba(244, 132, 95, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 24px rgba(244, 132, 95, 0.4);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: scale(0.97) translateY(0);
            box-shadow: 0 2px 8px rgba(244, 132, 95, 0.25);
        }

        .btn-primary:disabled {
            background: var(--sand);
            color: var(--warm-gray);
            box-shadow: none;
        }

        /* ======================== */
        /* STATUS                   */
        /* ======================== */
        #status {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            text-align: center;
            font-weight: 400;
        }

        #status:empty { display: none; }

        .success { color: var(--coral); font-weight: 500; }
        .error { color: #D94F4F; font-weight: 500; }

        /* ======================== */
        /* COFFEE LIST              */
        /* ======================== */
        #coffee-list {
            margin-top: 14px;
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #coffee-list::-webkit-scrollbar { width: 0; }

        .coffee-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: white;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(240, 230, 218, 0.6);
            position: relative;
            overflow: hidden;
        }

        .coffee-item::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            background: linear-gradient(135deg, rgba(252, 202, 176, 0.15), rgba(245, 193, 108, 0.08));
            transition: opacity 0.25s ease;
        }

        .coffee-item:hover {
            border-color: rgba(252, 202, 176, 0.5);
            box-shadow: var(--shadow-soft);
            transform: translateY(-1px);
        }

        .coffee-item:hover::before { opacity: 1; }

        .coffee-item:active {
            transform: scale(0.98);
            box-shadow: none;
        }

        .coffee-item.selected {
            border-color: var(--peach);
            box-shadow: 0 0 0 2px rgba(252, 202, 176, 0.3), var(--shadow-soft);
        }

        .coffee-item.selected::before { opacity: 1; }

        .coffee-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .coffee-icon.sunny {
            background: linear-gradient(140deg, var(--golden), var(--golden-warm));
            box-shadow: 0 3px 10px rgba(245, 193, 108, 0.35);
        }

        .coffee-icon.shaded {
            background: linear-gradient(140deg, var(--sand), #E4D8CC);
        }

        .coffee-info {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        .coffee-name {
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--warm-dark);
            letter-spacing: -0.01em;
        }

        .coffee-meta {
            font-size: 12px;
            margin-top: 3px;
            font-weight: 400;
        }

        .coffee-distance {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            color: var(--warm-gray);
            position: relative;
            z-index: 1;
            background: var(--blush);
            padding: 4px 10px;
            border-radius: 100px;
        }

        .sunny-tag { color: var(--golden-warm); font-weight: 500; }
        .shaded-tag { color: var(--warm-gray); }

        /* ======================== */
        /* DETAIL PANEL             */
        /* ======================== */
        #coffee-detail {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--panel-bg);
            backdrop-filter: blur(40px) saturate(1.6);
            -webkit-backdrop-filter: blur(40px) saturate(1.6);
            padding: 0 24px 24px;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            z-index: 200;
            max-height: 65vh;
            overflow-y: auto;
            box-shadow: 0 -8px 48px rgba(61, 46, 38, 0.14);
            border-top: 1px solid rgba(245, 193, 108, 0.25);
        }

        #coffee-detail::-webkit-scrollbar { width: 0; }

        #coffee-detail::before {
            content: '';
            display: block;
            width: 36px;
            height: 4px;
            background: var(--peach);
            border-radius: 4px;
            margin: 12px auto 18px;
            opacity: 0.6;
        }

        #coffee-detail.open {
            display: block;
            animation: detailSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes detailSlideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .detail-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--warm-dark);
            letter-spacing: -0.02em;
            flex: 1;
            padding-right: 12px;
        }

        .detail-close {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--blush);
            border: 1px solid rgba(240, 230, 218, 0.5);
            color: var(--warm-gray);
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        .detail-close:hover {
            background: var(--peach);
            color: var(--warm-dark);
        }

        .detail-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            padding: 10px 14px;
            background: white;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(240, 230, 218, 0.4);
            align-items: center;
        }

        .detail-label {
            color: var(--warm-gray);
            min-width: 72px;
            font-size: 11.5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .detail-value {
            flex: 1;
            font-weight: 400;
            color: var(--warm-dark);
        }

        .detail-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .detail-actions .btn-primary {
            padding: 13px 16px;
            font-size: 14px;
        }

        .btn-secondary {
            background: white;
            color: var(--warm-dark);
            border: 1.5px solid var(--sand);
            padding: 13px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            letter-spacing: 0.01em;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.25s ease;
        }

        .btn-secondary:hover {
            border-color: var(--peach);
            background: var(--blush);
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        @media (min-width: 600px) {
            #coffee-detail {
                left: auto;
                right: 20px;
                bottom: 20px;
                max-width: 360px;
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-lifted);
                border-top: none;
                border: 1px solid rgba(245, 193, 108, 0.2);
            }
            #coffee-detail::before { display: none; }
        }

        /* ======================== */
        /* MAP MARKERS              */
        /* ======================== */
        .coffee-marker {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 2.5px solid white;
        }

        .coffee-marker:hover {
            transform: scale(1.2);
        }

        .coffee-marker.sunny {
            background: linear-gradient(140deg, var(--golden), var(--golden-warm));
            box-shadow: 0 3px 12px rgba(245, 193, 108, 0.45), 0 0 0 0 rgba(245, 193, 108, 0);
            animation: sunnyGlow 2.5s ease-in-out infinite;
        }

        @keyframes sunnyGlow {
            0%, 100% { box-shadow: 0 3px 12px rgba(245, 193, 108, 0.45), 0 0 0 0 rgba(245, 193, 108, 0.15); }
            50% { box-shadow: 0 3px 12px rgba(245, 193, 108, 0.45), 0 0 0 6px rgba(245, 193, 108, 0); }
        }

        .coffee-marker.shaded {
            background: linear-gradient(140deg, #E4D8CC, #D4C8BC);
            box-shadow: 0 2px 8px rgba(61, 46, 38, 0.15);
        }

        .coffee-marker.highlighted {
            transform: scale(1.35);
            box-shadow: 0 0 0 3px var(--coral), 0 6px 20px rgba(244, 132, 95, 0.35);
            animation: none;
        }

        /* ======================== */
        /* USER MARKER              */
        /* ======================== */
        .user-marker {
            width: 24px;
            height: 24px;
            position: relative;
        }

        .user-marker-dot {
            width: 14px;
            height: 14px;
            background: var(--coral);
            border: 2.5px solid white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 8px rgba(244, 132, 95, 0.4);
        }

        .user-marker-pulse {
            width: 36px;
            height: 36px;
            background: rgba(244, 132, 95, 0.2);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: userPulse 2.2s ease-out infinite;
        }

        @keyframes userPulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
        }

        /* ======================== */
        /* MAPBOX OVERRIDES         */
        /* ======================== */
        .mapboxgl-ctrl-group {
            border-radius: var(--radius-sm) !important;
            box-shadow: var(--shadow-soft) !important;
            border: 1px solid rgba(240, 230, 218, 0.5) !important;
            overflow: hidden;
        }

        .mapboxgl-ctrl-group button {
            width: 38px !important;
            height: 38px !important;
        }

        @media (max-width: 600px) {
            .mapboxgl-ctrl-bottom-left,
            .mapboxgl-ctrl-bottom-right {
                display: none;
            }
        }

        /* ======================== */
        /* LOADING SHIMMER          */
        /* ======================== */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .loading-shimmer {
            background: linear-gradient(90deg, var(--sand) 25%, var(--blush) 50%, var(--sand) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: var(--radius-sm);
            height: 52px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="controls">
        <div class="app-header">
            <div class="app-title">Sunny Coffee</div>
            <div class="app-tagline">find your golden spot</div>
        </div>
        <div id="sun-info"></div>
        <button class="btn-primary" onclick="useMyLocation()" id="location-btn">Find Sunny Spots</button>
        <div id="status"></div>
        <div id="coffee-list"></div>
    </div>

    <div id="coffee-detail">
        <div class="detail-header">
            <div class="detail-title" id="detail-name"></div>
            <button class="detail-close" onclick="closeDetail()">&times;</button>
        </div>
        <div id="detail-content"></div>
        <div class="detail-actions">
            <button class="btn-primary" onclick="openDirections()">Directions</button>
            <button class="btn-secondary" onclick="closeDetail()">Close</button>
        </div>
    </div>

    <!-- Three.js (for shadow engine only - no rendering) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- SunCalc.js for sun position -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>

    <!-- Config (gitignored - contains API keys) -->
    <script src="config.js"></script>

    <!-- App modules -->
    <script src="js/osm-parser.js"></script>
    <script src="js/shadow-engine.js"></script>
    <script src="js/map-manager.js"></script>
    <script src="js/sun-manager.js"></script>
    <script src="js/coffee-manager.js"></script>

    <script>
        // ============================================
        // CONFIG
        // ============================================
        // MAPBOX_TOKEN is loaded from config.js (gitignored)
        const RADIUS = 1000; // 1km search radius

        // ============================================
        // GLOBAL STATE
        // ============================================
        let LAT = 47.2184;  // Default: Nantes, France
        let LON = -1.5536;
        let parser = null;
        let shadowEngine = null;
        let mapManager = null;
        let sunManager = null;
        let coffeeManager = null;
        let selectedShopId = null;
        let updateInterval = null;

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            // Check for Mapbox token
            if (!MAPBOX_TOKEN || MAPBOX_TOKEN === 'YOUR_MAPBOX_TOKEN_HERE') {
                document.getElementById('status').innerHTML =
                    '<p class="error">Please add your Mapbox token in index.html</p>';
                return;
            }

            // Initialize shadow engine (headless Three.js)
            shadowEngine = new ShadowEngine();

            // Initialize map
            mapManager = new MapManager('map', MAPBOX_TOKEN);
            mapManager.init(LAT, LON);

            // Show initial sun info
            updateSunInfoOnly();
        }

        // ============================================
        // LOCATION
        // ============================================
        function useMyLocation() {
            const statusDiv = document.getElementById('status');
            const locationBtn = document.getElementById('location-btn');

            if (!navigator.geolocation) {
                statusDiv.innerHTML = '<p class="error">Geolocation not supported</p>';
                return;
            }

            locationBtn.textContent = 'Locating...';
            locationBtn.disabled = true;
            statusDiv.innerHTML = '<p>Getting your location...</p>';

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    LAT = position.coords.latitude;
                    LON = position.coords.longitude;

                    // Update parser and managers
                    parser = new OSMParser(LAT, LON);
                    coffeeManager = new CoffeeManager(parser);

                    // Create sun manager with shadow engine
                    if (sunManager) sunManager.stopLiveSun();
                    sunManager = new SunManager(LAT, LON, { sunLight: { position: { set: () => {} }, color: { setHex: () => {} }, intensity: 0 } });

                    // Clear and reload
                    shadowEngine.clearBuildings();
                    mapManager.clearMarkers();

                    // Center map on user
                    mapManager.setCenter(LAT, LON);
                    mapManager.addUserMarker(LAT, LON);

                    locationBtn.textContent = 'Find Sunny Spots';
                    locationBtn.disabled = false;
                    statusDiv.innerHTML = '<p class="success">Found you!</p>';

                    // Load data
                    await loadData();

                    // Start live updates
                    startLiveUpdates();
                },
                (error) => {
                    locationBtn.textContent = 'Find Sunny Spots';
                    locationBtn.disabled = false;
                    let msg = 'Location error';
                    if (error.code === 1) msg = 'Permission denied';
                    if (error.code === 2) msg = 'Location unavailable';
                    if (error.code === 3) msg = 'Timeout';
                    statusDiv.innerHTML = `<p class="error">${msg}</p>`;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // ============================================
        // DATA LOADING
        // ============================================
        async function loadData() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<p>Loading buildings & cafes...</p>';

            // Show loading shimmer in coffee list
            const listEl = document.getElementById('coffee-list');
            listEl.innerHTML = '<div class="loading-shimmer"></div><div class="loading-shimmer"></div><div class="loading-shimmer"></div>';

            try {
                // Load buildings for shadow calculation
                const buildingQuery = `
                    [out:json][timeout:25];
                    (
                      way["building"](around:${RADIUS},${LAT},${LON});
                      relation["building"](around:${RADIUS},${LAT},${LON});
                    );
                    out body;
                    >;
                    out skel qt;
                `;

                const buildingUrl = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(buildingQuery)}`;
                const buildingResponse = await fetch(buildingUrl);
                const osmData = await buildingResponse.json();

                const buildings = parser.parse(osmData);
                shadowEngine.addBuildings(buildings);

                // Load coffee shops
                const coffeeShops = await coffeeManager.fetchCoffeeShops(LAT, LON, RADIUS);

                // Calculate initial sun status
                updateCoffeeSunStatus();

                // Add markers to map
                mapManager.addCoffeeMarkers(coffeeShops, selectCoffee);

                // Render list
                renderCoffeeList();

                statusDiv.innerHTML = `<p class="success">${coffeeShops.length} cafes found</p>`;

            } catch (error) {
                console.error('Error loading data:', error);
                statusDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
            }
        }

        // ============================================
        // SUN & SHADOW UPDATES
        // ============================================
        function startLiveUpdates() {
            if (updateInterval) clearInterval(updateInterval);

            // Update every second
            updateInterval = setInterval(() => {
                updateCoffeeSunStatus();
                renderCoffeeList();
                mapManager.updateAllMarkers(coffeeManager.getCoffeeShops());
            }, 1000);
        }

        function updateCoffeeSunStatus() {
            if (!sunManager || !coffeeManager) return;

            const shops = coffeeManager.getCoffeeShops();
            if (shops.length === 0) return;

            // Get current sun position
            const sunPos = SunCalc.getPosition(new Date(), LAT, LON);
            const isDay = sunPos.altitude > 0;

            if (!isDay) {
                // Night - all shaded
                shops.forEach(shop => {
                    shop.isSunny = false;
                });
            } else {
                // Day - check shadows via raycasting
                const sunDir = {
                    x: Math.cos(sunPos.altitude) * Math.sin(sunPos.azimuth),
                    y: Math.sin(sunPos.altitude),
                    z: Math.cos(sunPos.altitude) * Math.cos(sunPos.azimuth)
                };
                const sunVector = new THREE.Vector3(sunDir.x, sunDir.y, sunDir.z).normalize();

                shops.forEach(shop => {
                    shop.isSunny = shadowEngine.checkSunAtPosition(shop.x, shop.z, sunVector);
                });
            }

            // Predict future sun/shade times
            coffeeManager.predictSunnyTimes({
                getSunTimes: () => SunCalc.getTimes(new Date(), LAT, LON),
                sunPositionToVector: (alt, az) => ({
                    x: Math.cos(alt) * Math.sin(az),
                    y: Math.sin(alt),
                    z: Math.cos(alt) * Math.cos(az)
                })
            }, shadowEngine);

            updateSunInfo();
        }

        function updateSunInfoOnly() {
            const sunPos = SunCalc.getPosition(new Date(), LAT, LON);
            const times = SunCalc.getTimes(new Date(), LAT, LON);
            const altitude = (sunPos.altitude * 180 / Math.PI).toFixed(0);
            const isDay = sunPos.altitude > 0;

            const infoDiv = document.getElementById('sun-info');
            if (!isDay) {
                const sunriseTime = times.sunrise.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                infoDiv.innerHTML = `Sunrise at ${sunriseTime}`;
            } else {
                const sunsetTime = times.sunset.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                infoDiv.innerHTML = `${altitude}° above horizon &middot; Sunset ${sunsetTime}`;
            }
        }

        function updateSunInfo() {
            if (!coffeeManager) {
                updateSunInfoOnly();
                return;
            }

            const sunPos = SunCalc.getPosition(new Date(), LAT, LON);
            const times = SunCalc.getTimes(new Date(), LAT, LON);
            const altitude = (sunPos.altitude * 180 / Math.PI).toFixed(0);
            const isDay = sunPos.altitude > 0;

            const sunnyCount = coffeeManager.getSunnyShops().length;
            const totalCount = coffeeManager.getCoffeeShops().length;

            const infoDiv = document.getElementById('sun-info');
            if (!isDay) {
                const sunriseTime = times.sunrise.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                infoDiv.innerHTML = `Sunrise at ${sunriseTime}`;
            } else if (totalCount > 0) {
                infoDiv.innerHTML = `${altitude}° &middot; <strong>${sunnyCount}</strong> of ${totalCount} in the sun`;
            } else {
                const sunsetTime = times.sunset.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                infoDiv.innerHTML = `${altitude}° above horizon &middot; Sunset ${sunsetTime}`;
            }
        }

        // ============================================
        // UI RENDERING
        // ============================================
        function formatTimeRemaining(futureDate) {
            const now = new Date();
            const diffMs = futureDate - now;
            const diffMins = Math.round(diffMs / 60000);

            if (diffMins < 60) {
                return `${diffMins}min`;
            }
            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            return mins > 0 ? `${hours}h${mins}m` : `${hours}h`;
        }

        function renderCoffeeList() {
            const listEl = document.getElementById('coffee-list');
            if (!coffeeManager) {
                listEl.innerHTML = '';
                return;
            }

            const shops = coffeeManager.getShopsSorted();

            if (shops.length === 0) {
                listEl.innerHTML = '';
                return;
            }

            listEl.innerHTML = shops.map((shop, i) => {
                let statusText = '';
                if (shop.isSunny) {
                    if (shop.shadesAt) {
                        const remaining = formatTimeRemaining(shop.shadesAt);
                        statusText = `${remaining} of sun left`;
                    } else {
                        statusText = 'Sunny now';
                    }
                } else {
                    if (shop.sunnyAt) {
                        const time = shop.sunnyAt.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                        statusText = `Sun at ${time}`;
                    } else {
                        statusText = 'Shaded';
                    }
                }
                return `
                <div class="coffee-item ${shop.id === selectedShopId ? 'selected' : ''}"
                     onclick="selectCoffee(${JSON.stringify(shop).replace(/"/g, '&quot;')})"
                     style="animation: fadeInItem 0.35s ${i * 0.04}s cubic-bezier(0.16,1,0.3,1) both">
                    <div class="coffee-icon ${shop.isSunny ? 'sunny' : 'shaded'}">
                        ${shop.isSunny ? '&#9728;' : '&#9729;'}
                    </div>
                    <div class="coffee-info">
                        <div class="coffee-name">${shop.name}</div>
                        <div class="coffee-meta">
                            <span class="${shop.isSunny ? 'sunny-tag' : 'shaded-tag'}">
                                ${statusText}
                            </span>
                            ${shop.outdoor ? ' &middot; Terrace' : ''}
                        </div>
                    </div>
                    <div class="coffee-distance">${shop.distance}m</div>
                </div>
            `}).join('');
        }

        // Inject staggered animation keyframes
        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
            @keyframes fadeInItem {
                from { opacity: 0; transform: translateY(8px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(styleSheet);

        function selectCoffee(shop) {
            // Handle both object and event cases
            if (typeof shop === 'object' && shop.id) {
                selectedShopId = shop.id;
            } else {
                return;
            }

            const selectedShop = coffeeManager.getShopById(selectedShopId);
            if (!selectedShop) return;

            document.getElementById('detail-name').textContent = selectedShop.name;

            let content = '';
            let sunStatus = '';
            if (selectedShop.isSunny) {
                if (selectedShop.shadesAt) {
                    const remaining = formatTimeRemaining(selectedShop.shadesAt);
                    const time = selectedShop.shadesAt.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                    sunStatus = `Sunny for ${remaining} (until ${time})`;
                } else {
                    sunStatus = 'Currently sunny';
                }
            } else {
                if (selectedShop.sunnyAt) {
                    const time = selectedShop.sunnyAt.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                    sunStatus = `Shaded now, sunny at ${time}`;
                } else {
                    sunStatus = 'Shaded until sunset';
                }
            }
            content += `<div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value ${selectedShop.isSunny ? 'sunny-tag' : 'shaded-tag'}">
                    ${sunStatus}
                </span>
            </div>`;
            content += `<div class="detail-row">
                <span class="detail-label">Distance</span>
                <span class="detail-value">${selectedShop.distance} meters away</span>
            </div>`;
            if (selectedShop.address) {
                content += `<div class="detail-row">
                    <span class="detail-label">Address</span>
                    <span class="detail-value">${selectedShop.address}</span>
                </div>`;
            }
            if (selectedShop.openingHours) {
                content += `<div class="detail-row">
                    <span class="detail-label">Hours</span>
                    <span class="detail-value">${selectedShop.openingHours}</span>
                </div>`;
            }
            if (selectedShop.outdoor) {
                content += `<div class="detail-row">
                    <span class="detail-label">Terrace</span>
                    <span class="detail-value">Outdoor seating available</span>
                </div>`;
            }
            if (selectedShop.cuisine) {
                content += `<div class="detail-row">
                    <span class="detail-label">Type</span>
                    <span class="detail-value">${selectedShop.cuisine}</span>
                </div>`;
            }
            if (selectedShop.phone) {
                content += `<div class="detail-row">
                    <span class="detail-label">Phone</span>
                    <span class="detail-value"><a href="tel:${selectedShop.phone}" style="color: var(--coral); text-decoration: none; font-weight: 500;">${selectedShop.phone}</a></span>
                </div>`;
            }
            if (selectedShop.website) {
                content += `<div class="detail-row">
                    <span class="detail-label">Website</span>
                    <span class="detail-value"><a href="${selectedShop.website}" target="_blank" style="color: var(--coral); text-decoration: none; font-weight: 500;">Visit website</a></span>
                </div>`;
            }

            document.getElementById('detail-content').innerHTML = content;
            document.getElementById('coffee-detail').classList.add('open');

            // Highlight on map
            mapManager.highlightMarker(selectedShopId);

            renderCoffeeList();
        }

        function closeDetail() {
            selectedShopId = null;
            document.getElementById('coffee-detail').classList.remove('open');
            renderCoffeeList();
        }

        function openDirections() {
            const shop = coffeeManager.getShopById(selectedShopId);
            if (!shop) return;
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lon}`, '_blank');
        }

        // ============================================
        // START APP
        // ============================================
        init();
    </script>
</body>
