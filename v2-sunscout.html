<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SUNSCOUT</title>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --black: #111111;
            --off-white: #f2ede8;
            --warm-white: #faf7f3;
            --vermillion: #D94F3C;
            --yellow: #F5C542;
            --yellow-dim: #d4a830;
            --gray: #999590;
            --gray-light: #e0dbd5;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Instrument Sans', sans-serif;
            background: var(--off-white);
            color: var(--black);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== LAYOUT: Split screen ===== */
        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            background: var(--black);
            color: var(--off-white);
            padding: max(env(safe-area-inset-top), 8px) 16px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 100;
        }

        .brand {
            font-family: 'Archivo Black', sans-serif;
            font-size: 20px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--yellow);
            box-shadow: 0 0 12px rgba(245, 197, 66, 0.5);
            animation: dotPulse 2s ease-in-out infinite;
        }

        .brand-dot.night {
            background: var(--gray);
            box-shadow: none;
            animation: none;
        }

        @keyframes dotPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(245, 197, 66, 0.5); }
            50% { box-shadow: 0 0 24px rgba(245, 197, 66, 0.8); }
        }

        .sun-info-bar {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--gray);
        }

        /* ===== MAP ===== */
        #map {
            flex: 1;
            min-height: 0;
            border-bottom: 4px solid var(--black);
        }

        /* ===== BOTTOM PANEL ===== */
        #controls {
            background: var(--off-white);
            flex-shrink: 0;
            max-height: 45vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 700px) {
            .app-layout { flex-direction: row; }
            #map { flex: 1; border-bottom: none; border-right: 4px solid var(--black); }
            #controls {
                width: 380px;
                max-height: none;
                flex-shrink: 0;
            }
            .top-bar {
                position: fixed;
                top: 0; left: 0; right: 0;
                z-index: 200;
            }
            #map { margin-top: 48px; }
            #controls { margin-top: 48px; }
        }

        .panel-header {
            padding: 14px 16px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 2px solid var(--black);
        }

        .panel-title {
            font-family: 'Archivo Black', sans-serif;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .panel-count {
            font-family: 'Archivo Black', sans-serif;
            font-size: 11px;
            background: var(--black);
            color: var(--off-white);
            padding: 3px 10px;
            border-radius: 100px;
            letter-spacing: 0.06em;
        }

        /* ===== LOCATE BUTTON ===== */
        #location-btn {
            margin: 12px 16px;
            padding: 14px;
            background: var(--vermillion);
            color: white;
            border: none;
            border-radius: 0;
            font-family: 'Archivo Black', sans-serif;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        #location-btn:hover { background: #c23f2e; }
        #location-btn:active { transform: scale(0.98); }
        #location-btn:disabled {
            background: var(--gray-light);
            color: var(--gray);
        }

        #status {
            margin: 0 16px 8px;
            font-size: 12px;
            text-align: center;
            color: var(--gray);
            font-weight: 500;
            flex-shrink: 0;
        }
        #status:empty { display: none; }
        .success { color: var(--vermillion) !important; }
        .error { color: var(--vermillion) !important; }

        #sun-info { display: none; }

        /* ===== FILTER TABS ===== */
        .filter-tabs {
            display: flex;
            border-bottom: 2px solid var(--black);
            flex-shrink: 0;
        }
        .filter-tabs.hidden { display: none; }

        .filter-tab {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-right: 2px solid var(--black);
            font-family: 'Instrument Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .filter-tab:last-child { border-right: none; }
        .filter-tab.active {
            background: var(--black);
            color: var(--off-white);
        }
        .filter-tab:hover:not(.active) { background: rgba(0,0,0,0.04); }

        /* ===== CAFE LIST ===== */
        #coffee-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .scout-card {
            display: flex;
            align-items: stretch;
            border-bottom: 2px solid var(--black);
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }
        .scout-card:hover { background: rgba(0,0,0,0.02); }
        .scout-card:active { background: rgba(0,0,0,0.04); }
        .scout-card.selected { background: rgba(245, 197, 66, 0.08); }

        .scout-accent {
            width: 6px;
            flex-shrink: 0;
        }
        .scout-accent.sunny { background: var(--yellow); }
        .scout-accent.shaded { background: var(--gray-light); }

        .scout-body {
            flex: 1;
            padding: 12px 14px;
            min-width: 0;
        }

        .scout-top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .scout-name {
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .scout-dist {
            font-family: 'Archivo Black', sans-serif;
            font-size: 12px;
            color: var(--gray);
            flex-shrink: 0;
        }

        .scout-bottom {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .scout-tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 0;
        }
        .scout-tag.sunny {
            background: var(--yellow);
            color: var(--black);
        }
        .scout-tag.shaded {
            background: var(--gray-light);
            color: var(--gray);
        }

        .scout-time {
            font-size: 11px;
            color: var(--gray);
            font-weight: 500;
        }

        .scout-terrace {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--vermillion);
        }

        /* ===== DETAIL PANEL ===== */
        #coffee-detail {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--warm-white);
            border-top: 4px solid var(--black);
            z-index: 200;
            max-height: 70vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #coffee-detail.open { transform: translateY(0); }

        @media (min-width: 700px) {
            #coffee-detail {
                right: 0; left: auto; bottom: 0; top: 48px;
                width: 380px;
                max-height: none;
                border-top: none;
                border-left: 4px solid var(--black);
                transform: translateX(100%);
            }
            #coffee-detail.open { transform: translateX(0); }
        }

        .detail-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 2px solid var(--black);
        }

        .detail-title {
            font-family: 'Archivo Black', sans-serif;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 12px;
        }

        .detail-close {
            width: 32px; height: 32px;
            background: var(--black);
            color: var(--off-white);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: opacity 0.15s;
            flex-shrink: 0;
            padding: 0;
        }
        .detail-close:hover { opacity: 0.7; }

        .detail-status-strip {
            padding: 14px 16px;
            font-family: 'Archivo Black', sans-serif;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--black);
        }
        .detail-status-strip.sunny {
            background: var(--yellow);
            color: var(--black);
        }
        .detail-status-strip.shaded {
            background: var(--gray-light);
            color: var(--gray);
        }

        #detail-content { padding: 0; }

        .detail-row {
            display: flex;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            font-size: 14px;
        }
        .detail-label {
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--gray);
            min-width: 90px;
            padding-top: 1px;
        }
        .detail-value {
            flex: 1;
            color: var(--black);
        }
        .detail-value a {
            color: var(--vermillion);
            text-decoration: none;
            font-weight: 600;
        }
        .detail-value a:hover { text-decoration: underline; }

        .detail-actions {
            padding: 16px;
            display: flex;
            gap: 8px;
        }
        .detail-actions button {
            flex: 1;
            padding: 14px;
            font-family: 'Archivo Black', sans-serif;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }
        .btn-primary {
            background: var(--vermillion);
            color: white;
        }
        .btn-primary:hover { background: #c23f2e; }
        .btn-secondary {
            background: transparent;
            border: 2px solid var(--black) !important;
            color: var(--black);
        }
        .btn-secondary:hover { background: rgba(0,0,0,0.04); }

        /* ===== MAP MARKERS ===== */
        .coffee-marker {
            width: 32px; height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: 3px solid var(--black);
        }
        .coffee-marker:hover { transform: scale(1.15); }
        .coffee-marker.sunny {
            background: var(--yellow);
            box-shadow: 0 2px 8px rgba(245, 197, 66, 0.4);
        }
        .coffee-marker.shaded {
            background: var(--off-white);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .coffee-marker.highlighted {
            transform: scale(1.35);
            box-shadow: 0 0 0 4px var(--vermillion);
        }

        /* ===== USER MARKER ===== */
        .user-marker { width: 24px; height: 24px; position: relative; }
        .user-marker-dot {
            width: 14px; height: 14px;
            background: var(--vermillion);
            border: 3px solid white;
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .user-marker-pulse {
            width: 40px; height: 40px;
            background: rgba(217, 79, 60, 0.25);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: rPulse 2s ease-out infinite;
        }
        @keyframes rPulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* ===== ENTRANCE ANIMATIONS ===== */
        .top-bar {
            opacity: 0;
            animation: barSlide 0.4s 0.1s ease-out forwards;
        }
        @keyframes barSlide {
            from { opacity: 0; transform: translateY(-100%); }
            to { opacity: 1; transform: translateY(0); }
        }

        #controls {
            opacity: 0;
            animation: panelIn 0.5s 0.3s ease-out forwards;
        }
        @keyframes panelIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scout-card {
            opacity: 0;
            animation: cardSnap 0.25s ease-out forwards;
        }
        @keyframes cardSnap {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Mapbox overrides */
        .mapboxgl-ctrl-group {
            border-radius: 0 !important;
            border: 2px solid var(--black) !important;
            box-shadow: none !important;
        }
        @media (max-width: 700px) {
            .mapboxgl-ctrl-bottom-left,
            .mapboxgl-ctrl-bottom-right { display: none; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand">
                <div class="brand-dot" id="brand-dot"></div>
                SUNSCOUT
            </div>
            <div class="sun-info-bar" id="sun-info-bar"></div>
        </div>

        <!-- Map -->
        <div id="map"></div>

        <!-- Bottom Panel -->
        <div id="controls">
            <div class="panel-header">
                <div class="panel-title">Nearby Spots</div>
                <div class="panel-count" id="panel-count" style="display:none;"></div>
            </div>
            <div id="sun-info"></div>
            <button onclick="useMyLocation()" id="location-btn">Locate &amp; Scout</button>
            <div id="status"></div>
            <div class="filter-tabs hidden" id="filter-tabs">
                <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
                <button class="filter-tab" onclick="setFilter('sunny', this)">Sunny</button>
                <button class="filter-tab" onclick="setFilter('shaded', this)">Shaded</button>
            </div>
            <div id="coffee-list"></div>
        </div>
    </div>

    <!-- Detail -->
    <div id="coffee-detail">
        <div class="detail-top-bar">
            <div class="detail-title" id="detail-name"></div>
            <button class="detail-close" onclick="closeDetail()">&#215;</button>
        </div>
        <div id="detail-status-strip"></div>
        <div id="detail-content"></div>
        <div class="detail-actions">
            <button class="btn-primary" onclick="openDirections()">Directions</button>
            <button class="btn-secondary" onclick="closeDetail()">Close</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <script src="config.js"></script>
    <script src="js/osm-parser.js"></script>
    <script src="js/shadow-engine.js"></script>
    <script src="js/map-manager.js"></script>
    <script src="js/sun-manager.js"></script>
    <script src="js/coffee-manager.js"></script>

    <script>
        // MAPBOX_TOKEN is loaded from config.js (gitignored)
        const RADIUS = 1000;
        let LAT = 47.2184, LON = -1.5536;
        let parser = null, shadowEngine = null, mapManager = null, sunManager = null, coffeeManager = null;
        let selectedShopId = null, updateInterval = null;
        let currentFilter = 'all';

        function init() {
            if (!MAPBOX_TOKEN || MAPBOX_TOKEN === 'YOUR_MAPBOX_TOKEN_HERE') {
                document.getElementById('status').innerHTML = '<p class="error">Add your Mapbox token</p>';
                return;
            }
            shadowEngine = new ShadowEngine();
            mapManager = new MapManager('map', MAPBOX_TOKEN);
            mapManager.init(LAT, LON);
            updateSunInfoOnly();
        }

        function setFilter(type, el) {
            currentFilter = type;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderCoffeeList();
        }

        function useMyLocation() {
            const statusDiv = document.getElementById('status');
            const locationBtn = document.getElementById('location-btn');
            if (!navigator.geolocation) {
                statusDiv.innerHTML = '<p class="error">No geolocation</p>';
                return;
            }
            locationBtn.textContent = 'SCANNING...';
            locationBtn.disabled = true;
            statusDiv.innerHTML = '<p>Getting location...</p>';
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    LAT = position.coords.latitude;
                    LON = position.coords.longitude;
                    parser = new OSMParser(LAT, LON);
                    coffeeManager = new CoffeeManager(parser);
                    if (sunManager) sunManager.stopLiveSun();
                    sunManager = new SunManager(LAT, LON, { sunLight: { position: { set: () => {} }, color: { setHex: () => {} }, intensity: 0 } });
                    shadowEngine.clearBuildings();
                    mapManager.clearMarkers();
                    mapManager.setCenter(LAT, LON);
                    mapManager.addUserMarker(LAT, LON);
                    locationBtn.textContent = 'RESCAN';
                    locationBtn.disabled = false;
                    statusDiv.innerHTML = '<p class="success">Located</p>';
                    await loadData();
                    startLiveUpdates();
                },
                (error) => {
                    locationBtn.textContent = 'LOCATE & SCOUT';
                    locationBtn.disabled = false;
                    let msg = 'Location error';
                    if (error.code === 1) msg = 'Permission denied';
                    if (error.code === 2) msg = 'Unavailable';
                    if (error.code === 3) msg = 'Timeout';
                    statusDiv.innerHTML = `<p class="error">${msg}</p>`;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        async function loadData() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<p>Loading data...</p>';
            try {
                const buildingQuery = `[out:json][timeout:25];(way["building"](around:${RADIUS},${LAT},${LON});relation["building"](around:${RADIUS},${LAT},${LON}););out body;>;out skel qt;`;
                const buildingUrl = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(buildingQuery)}`;
                const buildingResponse = await fetch(buildingUrl);
                const osmData = await buildingResponse.json();
                const buildings = parser.parse(osmData);
                shadowEngine.addBuildings(buildings);
                const coffeeShops = await coffeeManager.fetchCoffeeShops(LAT, LON, RADIUS);
                updateCoffeeSunStatus();
                mapManager.addCoffeeMarkers(coffeeShops, selectCoffee);
                renderCoffeeList();
                document.getElementById('filter-tabs').classList.remove('hidden');
                const sunnyCount = coffeeManager.getSunnyShops().length;
                document.getElementById('panel-count').textContent = `${sunnyCount} SUNNY`;
                document.getElementById('panel-count').style.display = 'block';
                statusDiv.innerHTML = `<p class="success">${coffeeShops.length} spots scouted</p>`;
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = `<p class="error">${error.message}</p>`;
            }
        }

        function startLiveUpdates() {
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(() => {
                updateCoffeeSunStatus();
                renderCoffeeList();
                mapManager.updateAllMarkers(coffeeManager.getCoffeeShops());
            }, 1000);
        }

        function updateCoffeeSunStatus() {
            if (!sunManager || !coffeeManager) return;
            const shops = coffeeManager.getCoffeeShops();
            if (shops.length === 0) return;
            const sunPos = SunCalc.getPosition(new Date(), LAT, LON);
            const isDay = sunPos.altitude > 0;
            if (!isDay) {
                shops.forEach(shop => { shop.isSunny = false; });
            } else {
                const sunDir = {
                    x: Math.cos(sunPos.altitude) * Math.sin(sunPos.azimuth),
                    y: Math.sin(sunPos.altitude),
                    z: Math.cos(sunPos.altitude) * Math.cos(sunPos.azimuth)
                };
                const sunVector = new THREE.Vector3(sunDir.x, sunDir.y, sunDir.z).normalize();
                shops.forEach(shop => {
                    shop.isSunny = shadowEngine.checkSunAtPosition(shop.x, shop.z, sunVector);
                });
            }
            coffeeManager.predictSunnyTimes({
                getSunTimes: () => SunCalc.getTimes(new Date(), LAT, LON),
                sunPositionToVector: (alt, az) => ({
                    x: Math.cos(alt) * Math.sin(az),
                    y: Math.sin(alt),
                    z: Math.cos(alt) * Math.cos(az)
                })
            }, shadowEngine);
            updateSunInfo();
        }

        function updateSunInfoOnly() {
            const sunPos = SunCalc.getPosition(new Date(), LAT, LON);
            const times = SunCalc.getTimes(new Date(), LAT, LON);
            const altitude = (sunPos.altitude * 180 / Math.PI).toFixed(0);
            const isDay = sunPos.altitude > 0;
            const el = document.getElementById('sun-info-bar');
            const dot = document.getElementById('brand-dot');
            if (!isDay) {
                const t = times.sunrise.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                el.textContent = `Night \u2022 Sunrise ${t}`;
                dot.classList.add('night');
            } else {
                const t = times.sunset.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                el.textContent = `${altitude}\u00B0 \u2022 Sunset ${t}`;
                dot.classList.remove('night');
            }
        }

        function updateSunInfo() {
            if (!coffeeManager) { updateSunInfoOnly(); return; }
            const sunPos = SunCalc.getPosition(new Date(), LAT, LON);
            const times = SunCalc.getTimes(new Date(), LAT, LON);
            const altitude = (sunPos.altitude * 180 / Math.PI).toFixed(0);
            const isDay = sunPos.altitude > 0;
            const sunnyCount = coffeeManager.getSunnyShops().length;
            const totalCount = coffeeManager.getCoffeeShops().length;
            const el = document.getElementById('sun-info-bar');
            const dot = document.getElementById('brand-dot');
            if (!isDay) {
                const t = times.sunrise.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                el.textContent = `Night \u2022 Sunrise ${t}`;
                dot.classList.add('night');
            } else if (totalCount > 0) {
                el.textContent = `${altitude}\u00B0 \u2022 ${sunnyCount}/${totalCount} sunny`;
                dot.classList.remove('night');
                document.getElementById('panel-count').textContent = `${sunnyCount} SUNNY`;
            } else {
                const t = times.sunset.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                el.textContent = `${altitude}\u00B0 \u2022 Sunset ${t}`;
                dot.classList.remove('night');
            }
        }

        function formatTimeRemaining(futureDate) {
            const diffMins = Math.round((futureDate - new Date()) / 60000);
            if (diffMins < 60) return `${diffMins}min`;
            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            return mins > 0 ? `${hours}h${mins}m` : `${hours}h`;
        }

        function renderCoffeeList() {
            const listEl = document.getElementById('coffee-list');
            if (!coffeeManager) { listEl.innerHTML = ''; return; }
            let shops = coffeeManager.getShopsSorted();
            if (currentFilter === 'sunny') shops = shops.filter(s => s.isSunny);
            if (currentFilter === 'shaded') shops = shops.filter(s => !s.isSunny);
            if (shops.length === 0) { listEl.innerHTML = ''; return; }

            listEl.innerHTML = shops.map((shop, i) => {
                let statusLabel = shop.isSunny ? 'SUN' : 'SHADE';
                let timeText = '';
                if (shop.isSunny && shop.shadesAt) {
                    timeText = `${formatTimeRemaining(shop.shadesAt)} left`;
                } else if (!shop.isSunny && shop.sunnyAt) {
                    const t = shop.sunnyAt.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                    timeText = `Sun at ${t}`;
                }
                return `
                <div class="scout-card ${shop.id === selectedShopId ? 'selected' : ''}"
                     style="animation-delay: ${i * 0.03}s"
                     onclick="selectCoffee(${JSON.stringify(shop).replace(/"/g, '&quot;')})">
                    <div class="scout-accent ${shop.isSunny ? 'sunny' : 'shaded'}"></div>
                    <div class="scout-body">
                        <div class="scout-top">
                            <div class="scout-name">${shop.name}</div>
                            <div class="scout-dist">${shop.distance}m</div>
                        </div>
                        <div class="scout-bottom">
                            <span class="scout-tag ${shop.isSunny ? 'sunny' : 'shaded'}">${statusLabel}</span>
                            ${timeText ? `<span class="scout-time">${timeText}</span>` : ''}
                            ${shop.outdoor ? '<span class="scout-terrace">Terrace</span>' : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function selectCoffee(shop) {
            if (typeof shop !== 'object' || !shop.id) return;
            selectedShopId = shop.id;
            const s = coffeeManager.getShopById(selectedShopId);
            if (!s) return;

            document.getElementById('detail-name').textContent = s.name;

            // Status strip
            let stripEl = document.getElementById('detail-status-strip');
            let sunStatus = '';
            if (s.isSunny) {
                if (s.shadesAt) {
                    const rem = formatTimeRemaining(s.shadesAt);
                    const t = s.shadesAt.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                    sunStatus = `\u2600\uFE0F Sunny \u2014 ${rem} remaining (until ${t})`;
                } else {
                    sunStatus = '\u2600\uFE0F Currently in sun';
                }
                stripEl.className = 'detail-status-strip sunny';
            } else {
                if (s.sunnyAt) {
                    const t = s.sunnyAt.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                    sunStatus = `\uD83C\uDF25\uFE0F Shaded \u2014 Sun at ${t}`;
                } else {
                    sunStatus = '\uD83C\uDF25\uFE0F Shaded until sunset';
                }
                stripEl.className = 'detail-status-strip shaded';
            }
            stripEl.textContent = sunStatus;

            let content = '';
            content += `<div class="detail-row"><span class="detail-label">Distance</span><span class="detail-value">${s.distance}m</span></div>`;
            if (s.address) content += `<div class="detail-row"><span class="detail-label">Address</span><span class="detail-value">${s.address}</span></div>`;
            if (s.openingHours) content += `<div class="detail-row"><span class="detail-label">Hours</span><span class="detail-value">${s.openingHours}</span></div>`;
            if (s.outdoor) content += `<div class="detail-row"><span class="detail-label">Seating</span><span class="detail-value">Outdoor terrace</span></div>`;
            if (s.cuisine) content += `<div class="detail-row"><span class="detail-label">Type</span><span class="detail-value">${s.cuisine}</span></div>`;
            if (s.phone) content += `<div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value"><a href="tel:${s.phone}">${s.phone}</a></span></div>`;
            if (s.website) content += `<div class="detail-row"><span class="detail-label">Web</span><span class="detail-value"><a href="${s.website}" target="_blank">Visit</a></span></div>`;

            document.getElementById('detail-content').innerHTML = content;
            document.getElementById('coffee-detail').classList.add('open');
            mapManager.highlightMarker(selectedShopId);
            renderCoffeeList();
        }

        function closeDetail() {
            selectedShopId = null;
            document.getElementById('coffee-detail').classList.remove('open');
            renderCoffeeList();
        }

        function openDirections() {
            const shop = coffeeManager.getShopById(selectedShopId);
            if (!shop) return;
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lon}`, '_blank');
        }

        init();
    </script>
</body>
</html>
